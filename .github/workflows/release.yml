name: release

# Push a version tag (git tag v1.3.0 && git push origin v1.3.0) and this
# builds the Windows installer + portable zip and publishes a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tools
        run: |
          python -m pip install -r requirements.txt pyinstaller
          choco install innosetup -y --no-progress
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install pytest
          python -m pytest
      - name: Build app, zip and installer
        run: python packaging/build.py
      - name: Release notes from CHANGELOG
        run: |
          python - <<'EOF'
          import os, re
          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"## \[{re.escape(version)}\].*?\n(.*?)(?=\n## \[|\Z)", text, re.S)
          notes = (m.group(1).strip() if m else "See CHANGELOG.md.")
          notes = ("**Download `GhostRec-Setup-" + version + ".exe` below and run it.** "
                   "No admin rights or Python needed. Requires OBS Studio 28+ "
                   "with the WebSocket server enabled.\n\n" + notes)
          open("release-notes.md", "w", encoding="utf-8").write(notes)
          EOF
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/GhostRec-Setup-*.exe dist/GhostRec-*-portable.zip \
            --title "GhostRec ${GITHUB_REF_NAME}" --notes-file release-notes.md
